name: Build Paper Gallery daily art pack

on:
  workflow_dispatch:
  schedule:
    # Runs before the default 5:00 AM Toronto frame refresh in both EST and EDT.
    - cron: "0 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paper-gallery-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - run: python generator/generate_art.py --output site/feed --site site --count 8
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
